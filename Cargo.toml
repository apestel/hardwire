[package]
name = "hardwire"
version = "0.2.0"
authors = ["Adrien Pestel"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
# derive_more = "1.0.0"
askama = "0.16.0"
nanoid = "0.5"
log = "0.4.29"
pretty_env_logger = "0.5.0"
console-subscriber = "0.5.0"

# oauth2 = { version = "5.0.0", features = ["reqwest"] }
openidconnect = "4.0.1"
reqwest = { version = "0.13.0", features = ["json"] }
jsonwebtoken = { version = "11.0.0", features = ["aws_lc_rs"] }

clap = { version = "4.5.60", features = ["derive"] }
anyhow = "1.0.102"
tokio = { version = "1.49.0", features = ["full"] }
tokio-util = "0.7.18"
tower-http = { version = "0.7.0", features = ["full"] }
axum = { version = "0.8.8", features = ["ws", "tokio"] }
axum-extra = "0.12.5"
axum-tracing-opentelemetry = { version = "0.38.0" }
url = "2.5.8"
http = "1.4.0"
tempfile = "3.25.0"
sevenzip-mt = "0.2.2"

# opentelemetry-http = "0.13.0"
opentelemetry-otlp = { version = "0.32.0", default-features = true }

tracing = "0.1.44"
tracing-opentelemetry = "0.33.0"
tracing-subscriber = { version = "0.3.22", features = [
    "env-filter",
    "fmt",
    "json",
] }

init-tracing-opentelemetry = { version = "0.38.1", features = [
    "tracing_subscriber_ext",
] }

tracing-opentelemetry-instrumentation-sdk = "0.38.1"

sqlx = { version = "0.9.0", default-features = false, features = [
    "sqlite",
    "macros",
    "migrate",
    "runtime-tokio",
] }
chrono = "0.4.44"
# openssl = { version = "0.10.38", features = ["vendored"] }

# qbittorrent = { git = "https://github.com/apestel/qbittorrent" }
walkdir = "2.5.0"
uuid = { version = "1.21.0", features = ["v4", "serde"] }

bytes = "1.11.1"
futures = "0.3.32"
serde_json = "1.0.149"
serde = { version = "1.0.228", features = ["derive"] }
indextree = "4.7.4"
opentelemetry = { version = "0.32.0" }
thiserror = "2.0.18"
