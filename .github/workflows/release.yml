name: Release

on:
  push:
    tags:
      - 'v*'

env:
  IMAGE: pestouille/hardwire

# The public pipeline only builds and publishes the image. Production
# deployment is handled by the private `hardwire-deploy` repository (GitOps
# via Doco-CD on the production server) — no server credentials live here.
jobs:
  build-and-push:
    name: Build & push Docker image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          # Username is not a secret (it is public in the image name); the
          # secret only guards it against typos/renames. The token secret is
          # mandatory and must hold a Docker Hub access token (dpaq_/dckr_pat_).
          username: ${{ secrets.DOCKERHUB_USERNAME || 'pestouille' }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          build-args: |
            APP_VERSION=${{ steps.version.outputs.version }}
            APP_GIT_SHA=${{ github.sha }}
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ steps.version.outputs.version }}
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max